<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Fitri & Muhammad</title>
    <style>
        body { margin: 0; padding: 0; background-color: #fdfaf6; font-family: serif; text-align: center; }
        .cover { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        h1 { color: #7a8d71; font-size: 32px; }
        .nama-tamu { font-size: 24px; color: #4a4a4a; margin: 20px 0; font-style: italic; }
        .btn-buka { padding: 15px 40px; background-color: #7a8d71; color: white; border: none; border-radius: 30px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="cover">
        <p>The Wedding of</p>
        <h1>Fitri & Muhammad</h1>
        <p style="margin-top: 50px;">Kepada Yth:</p>
        <div class="nama-tamu" id="guest-name">Nama Tamu</div>
        <button class="btn-buka" onclick="bukaUndangan()">Buka Undangan</button>
    </div>

    <audio id="musikUndangan" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mpeg">
    </audio>

    <script>
        const params = new URLSearchParams(window.location.search);
        const to = params.get('to');
        if (to) document.getElementById('guest-name').innerText = to.replace(/\+/g, ' ');

        function bukaUndangan() {
            // Putar Musik
            document.getElementById('musikUndangan').play();
            // Pindah ke link Canva asli agar tidak gepeng
            setTimeout(() => {
                window.location.href = "https://www.canva.com/design/DAG-dXLx7zg/Nif8lqAsxbwJSA-ZKWZyEg/view?website#2"; 
            }, 500);
        }
    </script>

</body>
</html>
