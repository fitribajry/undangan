<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Undangan Fitri & Muhammad</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background-color: #fdfaf6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Kotak Nama Tamu */
        #guest-container {
            text-align: center;
            padding: 40px 20px;
            background-color: #ffffff;
            border-bottom: 2px solid #e0d5c1;
        }
        #guest-container p { margin: 0; color: #888; font-size: 14px; }
        #guest-container h2 { margin: 5px 0 0 0; color: #4a4a4a; font-style: italic; }

        /* Bingkai Undangan */
        .invitation-frame {
            width: 100%;
            height: 80vh; /* Mengatur tinggi agar kotak nama tetap terlihat */
            border: none;
        }
    </style>
</head>
<body>

    <div id="guest-container">
        <p>Kepada Yth. Bapak/Ibu/Saudara/i:</p>
        <h2 id="nama-tamu">Nama Tamu</h2>
    </div>

    <iframe class="invitation-frame" 
            src="https://www.canva.com/design/DAG-dXLx7zg/Nif8lqAsxbwJSA-ZKWZyEg/view?embed&mode=website" 
            allow="autoplay; fullscreen">
    </iframe>

    <script>
        // Kode untuk mengambil nama dari link URL
        const urlParams = new URLSearchParams(window.location.search);
        const nama = urlParams.get('to');
        if (nama) {
            document.getElementById('nama-tamu').innerText = nama.replace(/\+/g, ' ');
        }
    </script>

</body>
</html>
